<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Agency ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-row"><div class="logo">A</div><div class="brand-name">Agency ERP</div></div>
      <h1>Set a new password</h1>
      <p class="sub">Minimum 8 characters with letters and numbers</p>
      <div class="login-err" id="err"></div>
      <form id="form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/reset.js"></script>
</body>
</html>
