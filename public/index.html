<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Agency ERP — Digital marketing agency management portal" />
  <title>Sign in — Agency ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234527a0'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>A</text></svg>" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-row">
        <div class="logo">A</div>
        <div class="brand-name">Agency ERP</div>
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your workspace</p>

      <div class="login-err" id="err"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required placeholder="you@company.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <div class="row-between">
          <label class="checkbox"><input type="checkbox" id="remember" /> Remember me</label>
          <a href="#" class="forgot" id="forgotLink">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
      </form>

      <div class="demo-note" id="demoNote">
        <strong>Demo logins</strong><br/>
        Admin: admin@agency.com / Admin@12345<br/>
        Client: client1@demo.com / Client@123
      </div>
      <div style="text-align:center;margin-top:18px;font-size:.78rem;color:var(--ink-3)">Powered by Venkat</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
