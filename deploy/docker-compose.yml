# The one thing the portal cannot do on serverless.
#
#   cp .env.example .env      # fill it in first — nothing starts without it
#   docker compose up -d
#   docker compose logs -f    # scan the QR on first run
#
# Instagram publishing used to need a workflow engine here too. It doesn't any
# more — the portal does it itself on a schedule, so the only thing left that
# genuinely needs a machine of its own is the WhatsApp session: a logged-in
# browser, which dies with the process holding it.

name: nvkhub-automation

services:
  whatsapp-service:
    build: ../whatsapp-service
    container_name: whatsapp-approval-service
    restart: unless-stopped
    env_file: .env
    ports:
      # localhost only; the reverse proxy terminates TLS in front of it.
      - "127.0.0.1:4000:4000"
    volumes:
      # THE critical line. The logged-in WhatsApp session lives here; without
      # it every restart silently logs the account out and needs a fresh QR
      # scan, in person, on the phone that owns the number.
      - wa-session:/app/.wwebjs_auth
    # Chromium spawns a process tree and leaks zombies without an init.
    init: true
    # Chromium's default 64 MB /dev/shm is not enough for WhatsApp Web; it
    # dies with an opaque "Target closed" once the page grows. 512 MB is
    # comfortably enough and, unlike 1 GB, leaves room under the limit below —
    # this tmpfs is charged against the container's own memory, so a big
    # /dev/shm and a tight limit are the same mistake made twice.
    shm_size: "512m"

    # mem_limit rather than deploy.resources: outside Swarm, Docker Compose
    # applies these directly and ignores most of the deploy block. The old
    # limit was written there, which is worth knowing — it may never have been
    # enforced at all, and the real ceiling was the box.
    #
    # 2 GB and not more: n8n shares this 4 GB machine and wants about 900 MB.
    # A limit high enough to threaten n8n trades one outage for a worse one,
    # because then the kernel picks the victim rather than us.
    mem_limit: 2g
    # A gigabyte of swap on top. This is what turns the failure from fatal into
    # slow: Chromium's peak is while it syncs message history, right after
    # connecting, and without swap a peak one byte over the limit is a kill.
    # With it, the same peak pages out, finishes, and comes back. Needs swap on
    # the host — deploy/hostinger.sh creates it.
    memswap_limit: 3g
    healthcheck:
      # Only so `docker ps` tells the truth. Docker will not restart an
      # unhealthy container on its own — this is for whoever is looking, not
      # an automatic recovery.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  wa-session:
